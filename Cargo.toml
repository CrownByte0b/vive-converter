[package]
name = "vive-converter"
version = "1.0.1"
edition = "2024"
rust-version = "1.85"
license = "MPL-2.0"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
anyhow = "1"
flate2 = "1"
image = { version = "0.25", default-features = false, features = ["bmp", "gif", "jpeg", "png", "tiff", "webp"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
typed-path = "0.12"
uuid = { version = "1", features = ["js", "v5", "v7"] }
zip = { version = "6", default-features = false, features = ["deflate"] }
time = "0.3"

[target.'cfg(not(all(target_arch = "wasm32", target_os = "unknown")))'.dependencies]
clap = { version = "4", features = ["derive"] }
onenote_parser = { path = "../onenote.rs/crates/parser", features = ["onepkg"] }
rusqlite = { version = "0.40.2", features = ["bundled", "serialize"] }
tempfile = "3"

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
onenote_parser = { path = "../onenote.rs/crates/parser", default-features = false, features = ["onepkg"] }
rusqlite = { version = "0.40.2", features = ["serialize"] }
wasm-bindgen = "0.2"
